# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: openlineage-integration-common
  version: "1.55.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/OpenLineage/OpenLineage/archive/refs/tags/${{ version }}.tar.gz
  sha256: e2183a44767491b1b9f59dba56ebf54c575a9d79181d8e0d806f56e4f2a92cb6

build:
  number: 0
  noarch: python
  script:
    - cd integration/common
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.4,<0.14.0
  run:
    - python >=${{ python_min }},<4.0
    - attrs >=19.3.0
    - jinja2 >=2.11.3
    - openlineage-python
    - openlineage-sql >=1.55.0
    - pyyaml >=5.3.1

tests:
  - python:
      imports:
        - openlineage.common
        - openlineage.common.provider
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: OpenLineage common python library for integrations
  homepage: https://github.com/OpenLineage/OpenLineage
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - millsks
    - conda-forge/openlineage-sql
    - conda-forge/openlineage-python
