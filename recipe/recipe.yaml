# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: openlineage-integration-common
  version: 1.54.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/OpenLineage/OpenLineage/archive/refs/tags/${{ version }}.tar.gz
  sha256: 6a619be5a094f126de1da83419020cb757029c669d9384bac407018d4e3f7101

build:
  number: 0
  noarch: python
  script:
    - cd integration/common
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.4,<0.10.0
  run:
    - python >=${{ python_min }},<4.0
    - openlineage-python ==${{ version }}
    - openlineage-sql ==${{ version }}
tests:
  - python:
      imports:
        - openlineage.common
        - openlineage.common.provider
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: OpenLineage common python library for integrations
  homepage: https://github.com/OpenLineage/OpenLineage
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - millsks
    - conda-forge/openlineage-sql
    - conda-forge/openlineage-python
